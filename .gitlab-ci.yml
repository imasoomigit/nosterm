# GitLab CI for nostalgic-terminal.
#
# Two runners, both shell executors with no Docker:
#   - tag "Linux"  -> the Linux AppImage
#   - tag "MacOs"  -> the universal macOS DMG
# Every build job MUST carry its tag: the runners accept untagged jobs too, so
# an untagged build could land on the wrong OS.
#
# Every build uploads its artifact twice:
#   1. Generic Package Registry -- package "nostalgic-terminal", versioned by
#      commit; a plain one-click file download.
#   2. Container Registry (registry.desphilic.net) -- as an OCI image whose
#      single layer is the artifact, tagged by commit sha plus "latest".
#      scripts/push-to-registry.sh does this with curl+tar only, because both
#      runners are shell executors with no container daemon to `docker push`.
# The artifact is also attached to the pipeline as a normal job artifact.

stages:
  - test
  - secret-detection
  - build

# SAST / secret detection were auto-generated by GitLab when the project was
# created.  Kept as-is; they are allow_failure, so a runner without a Docker
# executor cannot block a build.
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  SECRET_DETECTION_ENABLED: 'true'
  PACKAGE_NAME: nostalgic-terminal
  FF_SCRIPT_SECTIONS: 'true'

sast:
  stage: test

secret_detection:
  stage: secret-detection

# --------------------------------------------------------------------------
# Shared setup for the two build jobs.
# --------------------------------------------------------------------------
.build_base:
  stage: build
  # Start immediately: do not wait on the scanner stages above.
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_BRANCH == "macos-preview"'
  before_script:
    - |
      echo "== host =="
      uname -a
      sw_vers 2>/dev/null || true
      echo "== toolchain =="
      for t in qmake qmake6 make git rsync wget curl nproc hdiutil lipo codesign node; do
        printf '  %-10s %s\n' "$t" "$(command -v "$t" 2>/dev/null || echo MISSING)"
      done
      echo "== qt candidates =="
      ls -d /opt/Qt* /opt/Qt/*/*/bin "$HOME"/Qt* /usr/local/opt/qt* /opt/homebrew/opt/qt* /usr/lib/qt6* 2>/dev/null || true
      echo "== disk =="
      df -h . | tail -1
      echo "== submodules =="
      git submodule status || true
    - |
      # Locate qmake anywhere a Qt install or a package manager might put it.
      # The globs are unquoted on purpose so the shell expands them; an
      # unmatched one stays literal and simply fails the -x test below.
      qmake_path() {
        local c
        # Prefer a Qt installed for this project over whatever the runner's
        # login shell happens to put first on PATH: /opt/Qt is installed with
        # Shader Tools, QtMultimedia and qttools/macdeployqt, while the Qt
        # that the Mac's profile shadows in has no QtMultimedia at all (and
        # the build dies on "Unknown module(s) in QT: multimedia").
        for c in /opt/Qt/*/macos/bin/qmake \
                 /opt/Qt/*/gcc_64/bin/qmake \
                 "$HOME"/Qt/*/macos/bin/qmake \
                 "$HOME"/Qt/*/gcc_64/bin/qmake \
                 "$(command -v qmake 2>/dev/null || true)" \
                 "$(command -v qmake6 2>/dev/null || true)" \
                 /usr/local/opt/qt*/bin/qmake \
                 /opt/homebrew/opt/qt*/bin/qmake \
                 /usr/lib/qt6/bin/qmake; do
          if [ -n "$c" ] && [ -x "$c" ]; then echo "$c"; return 0; fi
        done
        return 1
      }
      if ! QMAKE="$(qmake_path)"; then
        echo "FATAL: no qmake on this runner -- install Qt 6 (with Qt Shader Tools," >&2
        echo "       Qt 5 Compatibility and Qt Multimedia) before this job can build." >&2
        exit 1
      fi
      export PATH="$(dirname "$QMAKE"):$PATH"
      # Fedora ships only `qmake6`; both build scripts call plain `qmake`.
      if ! command -v qmake >/dev/null 2>&1; then
        WRAP="$(mktemp -d)"
        ln -sf "$QMAKE" "$WRAP/qmake"
        export PATH="$WRAP:$PATH"
        echo "qmake wrapper: $WRAP/qmake -> $QMAKE"
      fi
      echo "using qmake: $(command -v qmake)"
      qmake -v

# --------------------------------------------------------------------------
build:linux:
  extends: .build_base
  tags:
    - Linux
  variables:
    # linuxdeploy ships as an AppImage.  If the VM has no FUSE mount available
    # the runtime can unpack itself instead -- harmless when FUSE is there.
    APPIMAGE_EXTRACT_AND_RUN: "1"
  script:
    - ./scripts/build-appimage.sh
    - |
      ARTIFACT="$(ls -1 ./*.AppImage | head -n1)"
      if [ -z "$ARTIFACT" ]; then echo "FATAL: no AppImage produced" >&2; exit 1; fi
      echo "uploading $ARTIFACT to the package registry"
      curl --fail-with-body --show-error --silent \
           --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file "$ARTIFACT" \
           "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$PACKAGE_NAME/$CI_COMMIT_SHORT_SHA/$(basename "$ARTIFACT")"
      echo "pushing $ARTIFACT to the container registry"
      REGISTRY_HOST="${CI_REGISTRY:-registry.desphilic.net}" \
      REGISTRY_USER="gitlab-ci-token" \
      REGISTRY_PASSWORD="$CI_JOB_TOKEN" \
      IMAGE_TITLE="$(basename "$ARTIFACT")" \
      IMAGE_SOURCE="$CI_PROJECT_URL/-/tree/$CI_COMMIT_REF_NAME" \
      IMAGE_REVISION="$CI_COMMIT_SHA" \
      EXTRA_TAGS="latest" \
      ./scripts/push-to-registry.sh \
        "$ARTIFACT" "$CI_REGISTRY_IMAGE/linux" "$CI_COMMIT_SHORT_SHA" linux amd64
  artifacts:
    name: "nostalgic-terminal-linux-$CI_COMMIT_SHORT_SHA"
    paths:
      - "*.AppImage"
    expire_in: 1 month

build:macos:
  extends: .build_base
  tags:
    - MacOs
  script:
    - ./scripts/build-dmg.sh
    - |
      ARTIFACT="$(ls -1 ./*.dmg | head -n1)"
      if [ -z "$ARTIFACT" ]; then echo "FATAL: no DMG produced" >&2; exit 1; fi
      echo "uploading $ARTIFACT to the package registry"
      curl --fail-with-body --show-error --silent \
           --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file "$ARTIFACT" \
           "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$PACKAGE_NAME/$CI_COMMIT_SHORT_SHA/$(basename "$ARTIFACT")"
      echo "pushing $ARTIFACT to the container registry"
      # The DMG is deliberately tagged darwin: the image metadata says what the
      # payload really is.  Pulling it on a Linux box would be refused -- grab
      # the file from the package registry above instead.
      REGISTRY_HOST="${CI_REGISTRY:-registry.desphilic.net}" \
      REGISTRY_USER="gitlab-ci-token" \
      REGISTRY_PASSWORD="$CI_JOB_TOKEN" \
      IMAGE_TITLE="$(basename "$ARTIFACT")" \
      IMAGE_SOURCE="$CI_PROJECT_URL/-/tree/$CI_COMMIT_REF_NAME" \
      IMAGE_REVISION="$CI_COMMIT_SHA" \
      EXTRA_TAGS="latest" \
      ./scripts/push-to-registry.sh \
        "$ARTIFACT" "$CI_REGISTRY_IMAGE/macos" "$CI_COMMIT_SHORT_SHA" darwin amd64
  artifacts:
    name: "nostalgic-terminal-macos-$CI_COMMIT_SHORT_SHA"
    paths:
      - "*.dmg"
    expire_in: 1 month
